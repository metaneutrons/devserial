name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default. No job in this workflow writes anything.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Every published binary is built from one of these feature sets, on one of
  # these platforms. Linting and testing only the default set on Linux left the
  # GUI, the TUI and both other operating systems unchecked until release time.
  check:
    name: ${{ matrix.os }} / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Explicit combinations rather than a full product: every platform is
        # covered with the released feature set, and the reduced sets are
        # checked where they are actually shipped.
        include:
          - { os: ubuntu-latest, name: all-features, features: "--all-features" }
          - { os: ubuntu-latest, name: default, features: "" }
          - { os: ubuntu-latest, name: no-default-features, features: "--no-default-features" }
          - { os: ubuntu-latest, name: esp-tui, features: "--no-default-features --features esp,tui" }
          - { os: macos-latest, name: all-features, features: "--all-features" }
          - { os: macos-latest, name: default, features: "" }
          - { os: windows-latest, name: all-features, features: "--all-features" }
          - { os: windows-latest, name: default, features: "" }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.name }}

      - name: Install GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - name: Clippy
        run: cargo clippy --locked --all-targets ${{ matrix.features }} -- -D warnings

      - name: Unit tests
        run: cargo test --locked --lib ${{ matrix.features }}

      - name: Integration tests
        run: cargo test --locked --test '*' ${{ matrix.features }} -- --test-threads=1

      - name: Documentation
        run: cargo doc --locked --no-deps ${{ matrix.features }}
        env:
          RUSTDOCFLAGS: "-D warnings"

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version=$(grep '^rust-version' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - run: cargo check --locked --all-targets --all-features

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
