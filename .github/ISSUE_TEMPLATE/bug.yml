name: Bug report
description: Something does not behave the way it is documented to
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a security problem here. Use
        [Private Vulnerability Reporting](https://github.com/metaneutrons/devserial/security/advisories/new)
        instead; see [SECURITY.md](https://github.com/metaneutrons/devserial/blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: >
        The exact commands, smallest case that still shows it. If a serial
        device is involved, say which one and how it is connected.
      placeholder: |
        devserial open /dev/cu.usbserial-1420 --baud 115200
        devserial read /dev/cu.usbserial-1420 --from -20
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `devserial --version`, or the commit if built from source.
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which surface
      description: Where the problem shows. Pick every one you have confirmed.
      multiple: true
      options:
        - CLI
        - MCP server
        - background daemon
        - GUI monitor
        - terminal monitor (TUI)
        - packaging or installation
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system and version, and the architecture.
      placeholder: macOS 15.6 arm64, or Debian 12 amd64
    validations:
      required: true

  - type: input
    id: install
    attributes:
      label: How it was installed
      placeholder: Homebrew, AUR devserial-bin, .deb from deb.metaneutrons.cc, cargo install, built from source
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: >
        Most of the logging happens in the daemon, not in the short-lived client
        commands. Start it in the foreground with
        `RUST_LOG=devserial=debug devserial daemon`, reproduce the problem in a
        second terminal, and paste what the daemon printed. An explicit
        `RUST_LOG` overrides the `log_level` from the configuration file. Remove
        anything from your device's traffic you do not want public.
      render: text
