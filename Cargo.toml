[package]
name = "devserial"
version = "0.1.7"
edition = "2024"
authors = ["Fabian Schmieder"]
description = "MCP server bridging serial hardware to LLMs via SQLite-backed buffer"
license = "GPL-3.0-or-later"
repository = "https://github.com/metaneutrons/devserial"
keywords = ["serial", "mcp", "embedded", "uart", "sqlite"]
categories = ["hardware-support", "development-tools"]

# Debian package. The binary is built separately with every feature and
# cargo-deb only packages it, through scripts/release/build-deb.sh.
[package.metadata.deb]
maintainer = "metaneutrons <metaneutrons@users.noreply.github.com>"
section = "utils"
priority = "optional"
depends = "$auto"
# The GUI loads these at run time through dlopen, so they never appear in the
# ELF header and cargo-deb cannot find them. They are recommended rather than
# required because the CLI, the daemon, the MCP server and the TUI work
# without a display.
recommends = "libxkbcommon0, libx11-6, libwayland-client0, libgl1"
extended-description = """devserial captures a serial port into a SQLite database and serves that capture to an MCP client, a command line, a desktop window or a terminal monitor. A background daemon owns the open ports, so a capture survives an unplugged cable, a reboot of the device and a restart of the tools reading it."""
# The manual page and the Debian changelog are generated by
# scripts/release/build-deb.sh, which is how the package is built.
assets = [
    ["target/release/devserial", "usr/bin/", "755"],
    ["target/deb-extra/devserial.1.gz", "usr/share/man/man1/", "644"],
    ["target/deb-extra/changelog.Debian.gz", "usr/share/doc/devserial/", "644"],
    ["resources/deb-copyright", "usr/share/doc/devserial/copyright", "644"],
    ["README.md", "usr/share/doc/devserial/README.md", "644"],
    ["THIRD-PARTY-NOTICES.md", "usr/share/doc/devserial/THIRD-PARTY-NOTICES.md", "644"],
    ["licenses/*", "usr/share/doc/devserial/licenses/", "644"],
    ["resources/devserial.desktop", "usr/share/applications/", "644"],
    ["resources/icon-512.png", "usr/share/icons/hicolor/512x512/apps/devserial.png", "644"],
]

[lints.rust]
# The standard's normal case is "forbid". Lowered to "deny" because two
# platform integrations need real unsafe, and neither has a safe std API:
#
#   platform.rs  the macOS application menu, the clipboard and the edit state,
#                over Objective-C FFI
#   ipc.rs       SetHandleInformation on Windows, so the daemon does not
#                inherit this process's pipe handles and keep them open for
#                its whole life
#
# Both declare their FFI locally rather than through a dependency, mark every
# call site with its own #[allow(unsafe_code)] and carry a SAFETY comment. A
# third place needs the same justification or it is a defect: unsafe here is
# for platform APIs the standard library does not expose, nothing else.
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# Mehrfach eingebundene Crate-Versionen sind hier nicht in unserer Hand: der
# GUI-Stapel um eframe zieht mehrere Generationen derselben Crates. cargo-deny
# meldet sie unter [bans] weiterhin als Warnung, dort sind sie sichtbar.
multiple_crate_versions = "allow"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", optional = true }
eframe = { version = "0.36", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
ratatui = { version = "0.30", optional = true }
regex = "1"
rmcp = { version = "3.1", features = ["server", "macros", "transport-io", "transport-async-rw"] }
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serial2 = "0.2"
serial2-tokio = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[features]
default = ["esp"]
esp = []
testutil = []
monitor = ["eframe", "image"]
tui = ["ratatui", "crossterm"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
devserial = { path = ".", features = ["testutil"] }
tempfile = "3"
tokio-test = "0.4"

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
